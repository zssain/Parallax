# Full Parallax stack. From a clean checkout:
#   cp .env.example .env   # optional; every value below also has a dev default
#   docker compose up --build
# Then open http://localhost:5173 and sign in with a demo user (see the README).
#
# Boot order: postgres -> (bureau-mock, decision-service) -> seeder (one-shot, exits 0)
# -> application-service -> (assistant-service, account-service) -> web.

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parallax-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bureau-mock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: bureau-mock
    image: parallax-bureau-mock:local
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev   # enables /admin/fault used by the System screen
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  decision-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: decision-service
    image: parallax-decision-service:local
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot: runs Flyway, generates synthetic history and the 14 demo applications,
  # then exits (web-application-type=none + SpringApplication.exit). Reuses the
  # application-service image built below.
  seeder:
    image: parallax-application-service:local
    depends_on:
      postgres:
        condition: service_healthy
      bureau-mock:
        condition: service_healthy
      decision-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallax
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/parallax
      PARALLAX_APP_PASSWORD: ${PARALLAX_APP_PASSWORD:-app-dev}
      PARALLAX_OWNER_PASSWORD: ${PARALLAX_OWNER_PASSWORD:-owner-dev}
      PARALLAX_DATA_KEY: ${PARALLAX_DATA_KEY:-r7lS6KGA7fhaEF3Kk+cKcYYQ5KwI2h1xsEygj5d75hI=}
      PARALLAX_TOKEN_KEY: ${PARALLAX_TOKEN_KEY:-66yaR1D+9P3aLbna07mB/YKF0HsXxtud36b8LHwC7hM=}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-dev}
      PARALLAX_BUREAU_URL: http://bureau-mock:8082/ws
      PARALLAX_DECISION_URL: http://decision-service:8081
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-assistant-dev}
    command:
      - "--spring.profiles.active=dev,seed"
      - "--parallax.seed.generate-count=${SEED_COUNT:-20000}"
    restart: "no"

  application-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: application-service
    image: parallax-application-service:local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parallax
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/parallax
      PARALLAX_APP_PASSWORD: ${PARALLAX_APP_PASSWORD:-app-dev}
      PARALLAX_OWNER_PASSWORD: ${PARALLAX_OWNER_PASSWORD:-owner-dev}
      PARALLAX_DATA_KEY: ${PARALLAX_DATA_KEY:-r7lS6KGA7fhaEF3Kk+cKcYYQ5KwI2h1xsEygj5d75hI=}
      PARALLAX_TOKEN_KEY: ${PARALLAX_TOKEN_KEY:-66yaR1D+9P3aLbna07mB/YKF0HsXxtud36b8LHwC7hM=}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-dev}
      PARALLAX_BUREAU_URL: http://bureau-mock:8082/ws
      PARALLAX_DECISION_URL: http://decision-service:8081
      PARALLAX_ACCOUNTS_URL: http://account-service:8084
      PARALLAX_ASSISTANT_URL: http://assistant-service:8083
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-assistant-dev}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  assistant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: assistant-service
    image: parallax-assistant-service:local
    ports:
      - "8083:8083"
    depends_on:
      application-service:
        condition: service_healthy
    environment:
      PARALLAX_APPLICATION_URL: http://application-service:8080
      ASSISTANT_USERNAME: ${ASSISTANT_USERNAME:-assistant@parallax.dev}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-assistant-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PARALLAX_ASSISTANT_MODEL: ${PARALLAX_ASSISTANT_MODEL:-claude-sonnet-5}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: account-service
    image: parallax-account-service:local
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      application-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev   # enables the simulate-month demo endpoint
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounts
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/accounts
      ACCOUNTS_APP_PASSWORD: ${ACCOUNTS_APP_PASSWORD:-app-dev}
      ACCOUNTS_OWNER_PASSWORD: ${ACCOUNTS_OWNER_PASSWORD:-owner-dev}
      PARALLAX_APPLICATION_URL: http://application-service:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-dev}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password}   # in-memory demo users (priya, etc.)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: parallax-web:local
    ports:
      - "5173:80"
    depends_on:
      application-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
