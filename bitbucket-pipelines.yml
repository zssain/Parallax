image: maven:3.9-eclipse-temurin-21

definitions:
  services:
    docker:
      memory: 2048

pipelines:
  default:
    - step:
        name: Build and verify
        caches:
          - maven
        services:
          - docker
        script:
          - export TESTCONTAINERS_RYUK_DISABLED=true
          - ./mvnw -B verify
    - step:
        name: Web build
        image: node:20
        caches:
          - node
        script:
          - cd web
          - npm ci --legacy-peer-deps
          - npm run lint
          - npm run build
