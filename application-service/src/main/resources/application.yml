server:
  port: 8080

spring:
  application:
    name: application-service
  # Runtime connects as the least-privilege role parallax_app (INSERT/SELECT/UPDATE per grants).
  datasource:
    url: jdbc:postgresql://localhost:5432/parallax
    username: parallax_app
    password: ${PARALLAX_APP_PASSWORD:app-dev}
  # Flyway migrates as the schema owner parallax_owner; every migration ends with explicit grants.
  flyway:
    url: jdbc:postgresql://localhost:5432/parallax
    user: parallax_owner
    password: ${PARALLAX_OWNER_PASSWORD:owner-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

# PII keys are read from the environment first (PARALLAX_DATA_KEY, PARALLAX_TOKEN_KEY via relaxed
# binding). Left blank here: a non-dev profile with no env key fails fast at startup (see DataCipher).
parallax:
  data-key: ${PARALLAX_DATA_KEY:}
  token-key: ${PARALLAX_TOKEN_KEY:}
  # Downstream services (SPEC §2).
  decision:
    url: ${PARALLAX_DECISION_URL:http://localhost:8081}
  internal-token: ${INTERNAL_TOKEN:internal-dev}
  # Scheduled recovery jobs (SPEC §6; Prompt 10).
  jobs:
    redecision-ms: ${PARALLAX_JOBS_REDECISION_MS:60000}
    engine-retry-ms: ${PARALLAX_JOBS_ENGINE_RETRY_MS:60000}

# Resilience around the bureau (circuit breaker) and decision engine (retry) — SPEC §3, Prompt 10.
resilience4j:
  circuitbreaker:
    instances:
      bureau:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      decision:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.parallax.application.decision.DecisionUnavailableException

# Swagger is exposed only in the dev profile (see application-dev.yml and SecurityConfig).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
